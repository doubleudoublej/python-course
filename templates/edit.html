{% extends 'base.html' %}
{% block content %}
  <h1>Edit Card</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Front</label>
      <input name="front" class="form-control" value="{{ card.front }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Back</label>
      <textarea name="back" class="form-control" rows="4">{{ card.back }}</textarea>
    </div>
    <button class="btn btn-primary">Save</button>
  </form>
{% endblock %}
