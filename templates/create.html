{% extends 'base.html' %}
{% block content %}
  <h1>Create New Card</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Front</label>
      <input name="front" class="form-control" value="{{ front|default('') }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Back</label>
      <textarea name="back" class="form-control" rows="4">{{ back|default('') }}</textarea>
    </div>
    <button class="btn btn-primary">Create</button>
  </form>
{% endblock %}
