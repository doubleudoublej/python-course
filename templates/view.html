{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Card</h1>
    <div>
      <a class="btn btn-sm btn-secondary me-2" href="{{ url_for('edit_card', card_id=card.id) }}">Edit</a>
      <a class="btn btn-sm btn-outline-primary" href="{{ url_for('quiz') }}">Random Quiz</a>
    </div>
  </div>

  <div class="view-area d-flex justify-content-center">
    <div class="card enhanced-card">
      <div class="card-body">
        <h2 class="card-title">{{ card.front }}</h2>
        <hr>
        <p class="card-text fs-5">{{ card.back }}</p>
      </div>
    </div>
  </div>
{% endblock %}
